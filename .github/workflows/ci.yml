name: ci

# Builds and tests every push and pull request, and assembles the release
# archive to check that it still packages. Nothing is published from here.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml names the toolchain with its host
      # (x86_64-pc-windows-gnu), and rustup accepts such a name only once
      # that toolchain is installed, so it is installed by name first. The
      # GNU toolchain brings its own linker; nothing else is needed.
      - name: Install the pinned Rust toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($channel -notmatch '-x86_64-pc-windows-gnu$') { throw "rust-toolchain.toml names '$channel', which is not a GNU Windows toolchain" }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'the toolchain could not be installed' }
          rustc -vV
          $rustcHost = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          if ($rustcHost -ne 'x86_64-pc-windows-gnu') { throw "building with $rustcHost, not x86_64-pc-windows-gnu" }

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # Not part of the mod and not shipped: the test program that stands in
      # for the game's renderer start-up. Built so that it does not rot. It
      # has no lock file of its own, so this build is not --locked.
      - name: Build tools/standin
        run: cargo build --release --manifest-path tools/standin/Cargo.toml

      - name: The scripts are plain ASCII and parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($file in 'install.ps1', 'fetch-nvidia.ps1', 'deploy.ps1', '.github\scripts\package.ps1', 'tools\test-fetch-nvidia.ps1') {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) { Write-Host "::error::$file is not pure ASCII"; $bad++ }
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors) | Out-Null
            foreach ($problem in $errors) { Write-Host "::error::${file}: $problem"; $bad++ }
          }
          if ($bad) { throw "$bad problems in the scripts" }

      - name: Package
        run: ./.github/scripts/package.ps1 -Tag v0.0.0-ci -OutDir dist
