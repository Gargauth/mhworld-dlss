name: ci

# Every push and pull request: format, lint (release and dev, for the
# Windows target), host tests, the scripts, and both builds packaged
# (build.yml). Nothing is published from here; the dev archive is kept with
# the run, labelled -dev-build.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: [release, dev]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: lint-${{ matrix.flavour }}

      - name: Formatting
        if: matrix.flavour == 'release'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/standin/Cargo.toml --check

      # Clippy does not link, so the Windows code is checked from Linux
      # without zig. The release flavour leaves mhw-dev out: selecting it
      # turns on `dev` in every crate it depends on, and the release-only
      # (`not(feature = "dev")`) code would go unchecked.
      - name: Clippy (Windows target)
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu ${{ matrix.flavour == 'dev' && '--features dev' || '--exclude mhw-dev' }} -- -D warnings

      - name: Clippy (host)
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.flavour == 'dev' && '--features dev' || '--exclude mhw-dev' }} -- -D warnings

      - name: Clippy (tools/standin, Windows target)
        if: matrix.flavour == 'release'
        run: cargo clippy --manifest-path tools/standin/Cargo.toml --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: test

      # Without mhw-dev, which would unify `dev` into the release crates.
      - name: Host tests
        run: cargo test --workspace --locked --exclude mhw-dev

      - name: Host tests (dev)
        run: cargo test --workspace --locked --features dev

      - name: tools/standin tests
        run: cargo test --manifest-path tools/standin/Cargo.toml

      - name: devctl tests
        run: python -m unittest discover -s tools/devctl -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Windows PowerShell 5.1 reads a script without a BOM as the ANSI code
      # page, so anything outside ASCII would be mangled for some users.
      - name: The scripts are plain ASCII and parse
        shell: pwsh
        run: |
          $bad = 0
          $files = @(git ls-files '*.ps1' '*.cmd')
          if ($files.Count -eq 0) { throw 'no scripts found' }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) { Write-Host "::error file=$file::not pure ASCII"; $bad++ }
            if ($file -like '*.ps1') {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors) | Out-Null
              foreach ($problem in $errors) { Write-Host "::error file=$file,line=$($problem.Extent.StartLineNumber)::$($problem.Message)"; $bad++ }
            }
            Write-Host "checked $file"
          }
          if ($bad) { throw "$bad problems in the scripts" }

      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: v0.0.0-ci
