[package]
name = "mhw-core"
description = "mhw-dlss: core (see docs/ARCHITECTURE.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `kv`: structured fields (`key = value;`) on log lines.
log = { workspace = true, features = ["kv"] }
parking_lot = { workspace = true }

[features]
# Enables dev-only settings sections and the in-memory log ring.
dev = []
