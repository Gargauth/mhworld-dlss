[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/Gargauth/mhworld-dlss"
publish = false

[workspace.dependencies]
mhw-core = { path = "crates/core" }
mhw-win = { path = "crates/win" }
mhw-engine = { path = "crates/engine" }
mhw-render = { path = "crates/render" }
mhw-ngx = { path = "crates/ngx" }
mhw-fg = { path = "crates/fg" }
mhw-dev = { path = "crates/dev" }
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
# Line tables keep crash addresses resolvable with addr2line.
debug = 1

# The dev build: release code generation, but panics unwind so the dev
# server's `catch_unwind` around client and point tasks can drop a failing
# task instead of aborting the game. Panics never cross the FFI hooks
# (`extern` functions abort on unwind regardless).
[profile.dev-release]
inherits = "release"
panic = "unwind"
