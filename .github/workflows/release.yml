name: release

# Builds the two programs, packages them as they are extracted into the game
# folder, and attaches the archive and its SHA-256 sums to the release.
#
# A pushed tag v* creates the release as a draft with the files attached;
# publishing it is done by hand. Publishing a release also starts this
# workflow, and that run attaches the files only if they are not there yet,
# so a release never has its files replaced after somebody may have
# downloaded them. A manual run builds the same archive and keeps it as a
# workflow artifact without touching any release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Work out the tag
        id: tag
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if (-not $tag -and '${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}' }
          $release = [bool]$tag
          if (-not $tag) { $tag = 'v0.0.0-manual' }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$') {
            throw "'$tag' is not a tag of the form v1.2.3"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.release == 'true' && format('refs/tags/{0}', steps.tag.outputs.tag) || github.sha }}

      - name: The tag is the version in Cargo.toml
        if: steps.tag.outputs.release == 'true'
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ('${{ steps.tag.outputs.tag }}' -ne "v$version") {
            throw "the tag is ${{ steps.tag.outputs.tag }} and Cargo.toml says $version"
          }

      # rust-toolchain.toml names the toolchain with its host
      # (x86_64-pc-windows-gnu), and rustup accepts such a name only once
      # that toolchain is installed, so it is installed by name first. The
      # GNU toolchain brings its own linker; nothing else is needed.
      - name: Install the pinned Rust toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($channel -notmatch '-x86_64-pc-windows-gnu$') { throw "rust-toolchain.toml names '$channel', which is not a GNU Windows toolchain" }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'the toolchain could not be installed' }
          rustc -vV
          $rustcHost = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          if ($rustcHost -ne 'x86_64-pc-windows-gnu') { throw "building with $rustcHost, not x86_64-pc-windows-gnu" }

      # Set once for the test and the build. --remap-path-prefix keeps the
      # runner's paths out of the debug information and the panic messages;
      # when several prefixes match, the last one given wins, so the most
      # general comes first. MHW_DLSS_COMMIT is read by src/version.rs at
      # compile time and shown in the first line of both logs.
      - name: Build settings
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $flags = "--remap-path-prefix=$env:USERPROFILE=home --remap-path-prefix=$cargoHome=cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=."
          if (($env:USERPROFILE + $cargoHome + $env:GITHUB_WORKSPACE) -match '\s') {
            throw 'a path with a space in it cannot be passed through RUSTFLAGS'
          }
          "RUSTFLAGS=$flags" >> $env:GITHUB_ENV
          "MHW_DLSS_COMMIT=$((git rev-parse HEAD).Substring(0, 10))" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: No build path in the binaries
        run: |
          $needles = @($env:GITHUB_WORKSPACE, $env:USERPROFILE, (Split-Path -Leaf $env:USERPROFILE)) | Where-Object { $_ }
          foreach ($file in 'target\release\mhw_dlss.dll', 'target\release\launcher.exe') {
            $text = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes((Resolve-Path $file).Path))
            foreach ($needle in $needles) {
              foreach ($form in $needle, $needle.Replace('\', '/')) {
                if ($text.IndexOf($form, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                  throw "$file contains the build path '$form'"
                }
              }
            }
            if ($text.IndexOf($env:MHW_DLSS_COMMIT) -lt 0) { throw "$file does not carry the commit $env:MHW_DLSS_COMMIT" }
          }

      - name: Package
        run: ./.github/scripts/package.ps1 -Tag '${{ steps.tag.outputs.tag }}' -OutDir dist

      - name: Keep the archive with the run
        uses: actions/upload-artifact@v7
        with:
          name: mhworld-dlss-${{ steps.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Attach to the release
        if: steps.tag.outputs.release == 'true'
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $zip = "dist/mhworld-dlss-$tag.zip"
          $sums = 'dist/SHA256SUMS.txt'
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = @(
              'Install with the one-line installer or by hand: see the README.'
              ''
              "SHA-256 of the files is in SHA256SUMS.txt. Built from commit $env:MHW_DLSS_COMMIT."
              'NVIDIA''s libraries are not in the archive; the installer or fetch-nvidia.cmd downloads them from NVIDIA.'
            ) -join "`n"
            gh release create $tag $zip $sums --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title "mhworld-dlss $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'the release could not be created' }
            Write-Host "created a draft release for $tag with both files; publish it by hand"
          } elseif (@($existing) -contains "mhworld-dlss-$tag.zip") {
            Write-Host "release $tag already has its archive; nothing is replaced"
          } else {
            gh release upload $tag $zip $sums --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'the files could not be attached' }
            Write-Host "attached both files to the existing release $tag"
          }
