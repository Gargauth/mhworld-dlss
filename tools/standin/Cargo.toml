[package]
name = "standin"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "Stands in for the game's renderer start-up, to test mhw-dlss with companion tools outside the game"
repository = "https://github.com/Gargauth/mhworld-dlss"
publish = false

# Not part of the mod and not a workspace member: built on its own, with
#   cargo build --release --manifest-path tools/standin/Cargo.toml
# The log verdict (src/verdict.rs) is plain Rust and tested on any host:
#   cargo test --manifest-path tools/standin/Cargo.toml
[workspace]

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]
