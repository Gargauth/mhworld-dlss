name: release

# Builds both flavours (build.yml) and attaches the RELEASE archive and its
# SHA-256 sums to the GitHub release. The dev archive is built and kept with
# the workflow run only: it contains the dev server and is never a release
# asset.
#
# A pushed tag v* creates the release as a draft with the files attached;
# publishing it is done by hand. Publishing a release also starts this
# workflow, and that run attaches the files only if they are not there yet,
# so a release never has its files replaced after somebody may have
# downloaded them. A manual run builds the archives and keeps them as
# workflow artifacts without touching any release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Work out the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          release=false
          ref="$GITHUB_SHA"
          if [ -n "$tag" ]; then release=true; ref="refs/tags/$tag"; else tag=v0.0.0-manual; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not a tag of the form v1.2.3"; exit 1
          fi
          { echo "tag=$tag"; echo "release=$release"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: The tag is the version in Cargo.toml
        if: steps.tag.outputs.release == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag is $TAG and Cargo.toml says $version"; exit 1
          fi

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      ref: ${{ needs.tag.outputs.ref }}

  attach:
    needs: [tag, build]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # Only the release artifact is downloaded: the dev archive cannot be
      # attached by mistake because it is never on this runner.
      - uses: actions/download-artifact@v8
        with:
          name: mhworld-dlss-${{ needs.tag.outputs.tag }}
          path: dist

      - name: Attach to the release
        run: |
          zip="dist/mhworld-dlss-$TAG.zip"
          sums=dist/SHA256SUMS.txt
          test -f "$zip" && test -f "$sums"
          for file in dist/*; do
            case "$file" in *-dev*) echo "::error::$file is a dev file among the release files"; exit 1 ;; esac
          done
          if ! existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha | cut -c1-10)
            notes=$(printf '%s\n' \
              'Install with the one-line installer or by hand: see the README.' \
              '' \
              "SHA-256 of the files is in SHA256SUMS.txt. Built from commit $commit." \
              "NVIDIA's libraries are not in the archive; the installer or fetch-nvidia.cmd downloads them from NVIDIA.")
            gh release create "$TAG" "$zip" "$sums" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "mhworld-dlss $TAG" --notes "$notes"
            echo "created a draft release for $TAG with both files; publish it by hand"
          elif printf '%s\n' "$existing" | grep -qxF "mhworld-dlss-$TAG.zip"; then
            echo "release $TAG already has its archive; nothing is replaced"
          else
            gh release upload "$TAG" "$zip" "$sums" --repo "$GITHUB_REPOSITORY"
            echo "attached both files to the existing release $TAG"
          fi
